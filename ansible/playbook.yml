- name:  shinshu68 development environment
  hosts: localhost
  connection: local

  vars:
    home_path:     '{{ lookup("env", "HOME") }}'
    dotfiles_path: '{{ home_path }}/dotfiles'
    user_name:     '{{ lookup("env", "USER") }}'

  roles:
    - role: apt
      tags: ['apt']
    - role: fish
      tags: ['fish']
    - role: bash
      tags: ['bash']
    - role: mise
      tags: ['mise']
    - role: pip
      tags: ['pip']
    - role: claude
      tags: ['claude']
    - role: vscode
      tags: ['vscode']
    - role: windows_terminal
      tags: ['windows_terminal']
    - role: link
      tags: ['link']
