- set_fact:
    python: {}

- name: install suggested build environment
  become: yes
  apt:
    name:             '{{ suggest_packages }}'
    update_cache:     yes
    cache_valid_time: 3600
  vars:
    suggest_packages:
      - build-essential
      - curl
      - libbz2-dev
      - libffi-dev
      - liblzma-dev
      - libncurses-dev
      - libreadline-dev
      - libsqlite3-dev
      - libssl-dev
      - libxml2-dev
      - libxmlsec1-dev
      - libzstd-dev
      - llvm
      - make
      - tk-dev
      - wget
      - xz-utils
      - zlib1g-dev

- name: check pyenv
  command: |
    bash -lc 'which pyenv'
  register: which_pyenv
  failed_when: False
  changed_when: False

- name: install pyenv
  command: |
    bash -lc 'anyenv install pyenv'
  when: which_pyenv.rc > 0

- name: get installed versions
  command: |
    bash -lc 'pyenv versions --bare'
  register: installed_versions
  changed_when: False

- name: install python
  command: |
    bash -lc 'pyenv install {{ item | quote }}'
  when: item not in installed_versions.stdout_lines
  with_items: '{{ python.versions }}'

- name: get global python
  command: |
    bash -lc 'pyenv global'
  register: global_version
  changed_when: False

- name: set global python
  command: |
    bash -lc 'pyenv global {{ python.versions[0] | quote }}'
  when: global_version.stdout != python.versions[0]

- name: rehash
  shell: |
    if [ -f "$DOTSHIM_FILE" ]; then
      rm -f "$DOTSHIM_FILE"
    fi
    bash -lc 'pyenv rehash'
  environment:
    DOTSHIM_FILE: '{{ anyenv.envs_dir }}/pyenv/.pyenv-shim'
  changed_when: False
