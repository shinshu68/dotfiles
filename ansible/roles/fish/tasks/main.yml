- name: add fish repository
  become: yes
  apt_repository:
    repo:         'ppa:fish-shell/release-4'
    state:        present
    update_cache: yes

- name: install fish
  become: yes
  apt:
    name:             ['fish', 'curl']
    state:            latest
    update_cache:     yes
    cache_valid_time: 3600

- name: create fish config directories
  file:
    path:  '{{ home_path }}/.config/fish/{{ item }}'
    state: directory
    mode:  0755
  with_items:
    - functions
    - completions

- name: check fish config destinations
  stat:
    path: '{{ home_path }}/.config/fish/{{ item }}'
  with_items: '{{ fish_link_files }}'
  register: fish_link_dest_stat

- name: create fish config backup files
  command: |
    mv -f \
      {{ home_path | quote }}/.config/fish/{{ item.item | quote }} \
      {{ home_path | quote }}/.config/fish/{{ item.item | quote }}.bak
  when: item.stat.exists and not item.stat.islnk
  loop_control:
    label: '{{ item.item }}'
  with_items: '{{ fish_link_dest_stat.results }}'

- name: create symlinks
  file:
    src:   '{{ dotfiles_fish_config_path }}{{ item }}'
    dest:  '{{ home_path }}/.config/fish/{{ item }}'
    owner: '{{ user_name }}'
    group: '{{ user_name }}'
    state: link
    force: yes
  with_items: '{{ fish_link_files }}'

- name: check fisher version
  shell: |
    fish -lc "fisher --version"
  register: fisher_version
  failed_when: False
  changed_when: False

- name: install fisher
  shell: |
    fish -lc "curl -sL https://raw.githubusercontent.com/jorgebucaran/fisher/main/functions/fisher.fish | source && fisher install jorgebucaran/fisher"
  when: fisher_version.rc != 0

# fish_plugins に書かれたプラグインを入れ、書かれていないものは消す
- name: update fisher and plugins
  shell: |
    fish -lc "fisher update"
  changed_when: False
