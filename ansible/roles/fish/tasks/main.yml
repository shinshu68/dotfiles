- set_fact:
    dotfiles_fish_config_path: '{{ dotfiles_path }}/config/fish/'

- name: add fish repository
  become: yes
  apt_repository:
    repo:         'ppa:fish-shell/release-4'
    state:        present
    update_cache: yes

- name: install fish
  become: yes
  apt:
    name:             ['fish', 'curl']
    state:            latest
    update_cache:     yes
    cache_valid_time: 3600

- name: check fish config functions directory
  stat:
    path: '{{ home_path }}/.config/fish/functions'
  register: config_functions

- name: create fish config directory
  file:
    path:  '{{ home_path }}/.config/fish/functions'
    state: directory
    mode:  0755
  when: not config_functions.stat.exists

- name: check fish completions directory
  stat:
    path: '{{ home_path }}/.config/fish/completions'
  register: config_completions

- name: create fish config directory
  file:
    path:  '{{ home_path }}/.config/fish/completions'
    state: directory
    mode:  0755
  when: not config_completions.stat.exists

- name: get fish config files
  find:
    paths:   '{{ dotfiles_fish_config_path }}'
    recurse: yes
  register: fish_files

- name: create symlinks
  file:
    src:   '{{ item.path }}'
    dest:  '{{ home_path }}/.config/fish/{{ item.path[dotfiles_fish_config_path|length:] }}'
    owner: '{{ user_name }}'
    group: '{{ user_name }}'
    state: link
    force: yes
  loop_control:
    label: '{{ item.path | basename }}'
  with_items: '{{ fish_files.files }}'

- name: check fisher version
  shell: |
    fish -lc "fisher --version"
  register: fisher_version
  failed_when: False
  changed_when: False

# fisher 3 が残っていると 4 系のインストールがファイルの衝突で失敗するので、先に消す
- name: uninstall fisher 3
  shell: |
    fish -lc "fisher self-uninstall"
  when: fisher_version.rc == 0 and 'version 3.' in fisher_version.stdout

- name: install fisher
  shell: |
    fish -lc "curl -sL https://raw.githubusercontent.com/jorgebucaran/fisher/main/functions/fisher.fish | source && fisher install jorgebucaran/fisher"
  when: fisher_version.rc != 0 or 'version 4.' not in fisher_version.stdout

- name: update fisher and plugins
  shell: |
    fish -lc "fisher update"
  when: fisher_version.rc == 0 and 'version 4.' in fisher_version.stdout
  changed_when: False

- name: check installed fisher plugins
  shell: |
    fish -lc "fisher list"
  register: installed_fisher_plugins
  changed_when: False

- name: install fisher plugins
  shell: |
    fish -lc "fisher install {{ item }}"
  when: item not in installed_fisher_plugins.stdout_lines
  with_items: '{{ fish.fisher_plugins }}'
