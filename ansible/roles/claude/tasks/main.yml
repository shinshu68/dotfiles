- set_fact:
    claude: {}

- name: check claude code
  stat:
    path: '{{ home_path }}/.local/bin/claude'
  register: claude_stat

# インストール後は Claude Code 自身が自動更新するので、ここでは入れるだけにする
- name: install claude code
  shell: |
    curl -fsSL https://claude.ai/install.sh | bash
  when: not claude_stat.stat.exists

- name: link claude config files
  import_role:
    name: link
  vars:
    link_items: '{{ claude.link }}'

# Windows 側からリンクする時点で実体がないとディレクトリへのリンクとして作れないので、先に作っておく
- name: allocate directories shared with windows
  file:
    dest:  '{{ home_path }}/{{ item }}'
    state: directory
    owner: '{{ user_name }}'
    group: '{{ user_name }}'
  loop_control:
    label: '~/{{ item }}'
  with_items: '{{ claude.windows_share | default([]) }}'
  when: lookup("env", "WSL_DISTRO_NAME") != ""

# Windows 側の VS Code（Claude Code 拡張）からも同じ設定を使えるよう、WSL のときは Windows 側にもリンクする
# バックログのように dotfiles では管理しないデータ（claude.windows_share）は、WSL 側のホームにある実体へリンクする
# Windows から WSL 内のファイルは \\wsl.localhost\<distro>\... のパスでリンクする
# シンボリックリンクの作成には Windows の開発者モード（または管理者権限）が必要
- name: link claude config files on windows
  command: |
    powershell.exe -NoProfile -NonInteractive -EncodedCommand {{ lookup("template", "link-windows.ps1.j2") | b64encode(encoding="utf-16-le") }}
  args:
    chdir: /mnt/c
  vars:
    wsl_distro_name: '{{ lookup("env", "WSL_DISTRO_NAME") }}'
  register: link_windows_result
  changed_when: "'changed' in link_windows_result.stdout"
  when: lookup("env", "WSL_DISTRO_NAME") != ""
