- set_fact:
    link: {}

- name: check obsolete links
  stat:
    path: '{{ home_path }}/{{ item }}'
  loop_control:
    label: '~/{{ item }}'
  with_items: '{{ unlink_items }}'
  register: unlink_stat

- name: remove obsolete links
  file:
    path:  '{{ home_path }}/{{ item.item }}'
    state: absent
  loop_control:
    label: '~/{{ item.item }}'
  when: item.stat.islnk is defined and item.stat.islnk and item.stat.lnk_source.startswith(dotfiles_path ~ '/')
  with_items: '{{ unlink_stat.results }}'

- name: check dir stat
  stat:
    path: '{{ home_path }}/{{ item }}'
  loop_control:
    label: '~/{{ item }}'
  when: item != ""
  with_items: '{{ link_items.values() | map("dirname") | unique | list }}'
  register: dir_stat
 
- name: allocate parent directories
  file:
    dest:    '{{ home_path }}/{{ item.item }}'
    state:   directory
    owner:   '{{ user_name }}'
    group:   '{{ user_name }}'
    recurse: yes
  loop_control:
    label: '~/{{ item.item }}'
  when: item.item != "" and not item.stat.exists
  with_items: '{{ dir_stat.results }}'

- name: check destinations
  stat:
    path: '{{ home_path }}/{{ item.value }}'
  loop_control:
    label: '{{ item.value }}'
  with_dict: '{{ link_items }}'
  register: dest_stat

- name: create backup files
  command: |
    mv -f \
      {{ home_path | quote }}/{{ item.item.value | quote }} \
      {{ home_path | quote }}/{{ item.item.value | quote }}.bak
  when: item.stat.exists and not item.stat.islnk
  loop_control:
    label: '{{ item.item.value }}'
  with_items: '{{ dest_stat.results }}'

- name: create symlinks
  file:
    src:   '{{ dotfiles_path }}/{{ item.key }}'
    dest:  '{{ home_path }}/{{ item.value }}'
    owner: '{{ user_name }}'
    group: '{{ user_name }}'
    state: link
    force: yes
  loop_control:
    label: '{{ item.value }}'
  with_dict: '{{ link_items }}'

# 既にあれば中身も更新日時も変えない
- name: create local files
  file:
    path:              '{{ home_path }}/{{ item }}'
    state:             touch
    owner:             '{{ user_name }}'
    group:             '{{ user_name }}'
    modification_time: preserve
    access_time:       preserve
  loop_control:
    label: '~/{{ item }}'
  with_items: '{{ local_files_items }}'
