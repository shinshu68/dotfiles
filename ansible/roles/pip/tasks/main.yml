# mise で入れた Python の pip を使う
- name: get mise pip
  command: |
    mise which pip
  register: mise_pip
  changed_when: False
  check_mode: no
  when: pip.packages

- name: pip install
  pip:
    name:       '{{ pip.packages }}'
    state:      latest
    executable: '{{ mise_pip.stdout }}'
  when: pip.packages
