- set_fact:
    mise: {}

# mise 本体は apt ロールで入れる
- name: link mise config files
  import_role:
    name: link
  vars:
    link_items: '{{ mise.link }}'
    unlink_items: []
    local_files_items: []

# 入れるツールとバージョンは config/mise/config.toml に書く
- name: install mise tools
  command: |
    mise install --yes
  register: mise_install
  changed_when: "'all tools are installed' not in mise_install.stderr"

- name: check mise node
  command: |
    mise which node
  register: mise_node
  failed_when: False
  changed_when: False
  check_mode: no

# 以前 anyenv・pyenv・n で入れていたものを消す。mise の Node が入ったことを確かめてから消す
- block:
  - name: remove anyenv
    file:
      path:  '{{ home_path }}/.anyenv'
      state: absent

  - name: check bash_profile
    stat:
      path: '{{ home_path }}/.bash_profile'
    register: bash_profile_stat

  # anyenv ロールが blockinfile の既定のマーカーで書いていた初期化処理
  - name: remove anyenv init from bash_profile
    blockinfile:
      path:  '{{ home_path }}/.bash_profile'
      state: absent
    when: bash_profile_stat.stat.exists

  # n で入れた Node と、npm -g で入れたパッケージへのリンク
  - name: remove old node links and npm man pages
    become: yes
    shell: |
      for dir in /usr/local/bin /usr/local/share/man/man1; do
        if [ -d "$dir" ]; then
          find "$dir" -maxdepth 1 -type l -lname '*lib/node_modules/*' -print -delete
        fi
      done
      if [ -d /usr/local/share/man/man1 ]; then
        find /usr/local/share/man/man1 -maxdepth 1 -type f \( -name 'npm.1' -o -name 'npm-*.1' -o -name 'npx.1' \) -print -delete
      fi
    register: old_node_links
    changed_when: old_node_links.stdout != ''

  - name: remove old node files
    become: yes
    file:
      path:  '{{ item }}'
      state: absent
    with_items:
      - /usr/local/bin/node
      - /usr/local/include/node
      - /usr/local/lib/node_modules
      - /usr/local/n
      - /usr/local/share/doc/node
      - /usr/local/share/man/man1/node.1
      - /usr/local/share/systemtap/tapset/node.stp
  when: mise_node.rc == 0
