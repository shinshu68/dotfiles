anyenv:
  dir:         '{{ home_path }}/.anyenv'
  plugins_dir: '{{ home_path }}/.anyenv/plugins'
  envs_dir:    '{{ home_path }}/.anyenv/envs'

apt:
  repositories: []

  packages:
    - cmake
    - direnv
    - git
    - libclang-dev
    - neofetch
    - neovim
    - nodejs
    - p7zip-full
    - python3-apt
    - python3-pip
    - tmux
    - tree
    - vim-nox
    - xclip
    - xsel

python:
  version2:
    - '2.7.15'
  version3:
    - '3.7.2'

pip:
  packages:
    - PyGithub
    - autopep8
    - beautifulsoup4
    - click
    - flake8
    - flask
    - gitPython
    - inquirer
    - jedi
    - matplotlib
    - neovim
    - numpy
    - pipreqs
    - pyperclip
    - pyyaml
    - readchar
    - requests
    - toml
    - truecolor
    - youtube_dl

fish:
  fisher_plugins:
    - jethrokuan/fzf
    - oh-my-fish/theme-bobthefish

link:
  claude/CLAUDE.md:     .claude/CLAUDE.md
  claude/commands:      .claude/commands
  claude/settings.json: .claude/settings.json
  claude/skills:        .claude/skills
  config/nvim:          .config/nvim
  git/config:           .gitconfig
  tmux/tmux.conf:       .tmux.conf

others:
  repos:
    - repo: 'git@github.com:shinshu68/emoji-fish.git'
      dest: '{{ home_path }}/workspace/emoji-fish'
    - repo: 'git@github.com:shinshu68/BookShelf.git'
      dest: '{{ home_path }}/workspace/bookshelf'
    - repo: 'git@github.com:toyota-ct-selab/shinshu_works.git'
      dest: '{{ home_path }}/shinshu_works'
