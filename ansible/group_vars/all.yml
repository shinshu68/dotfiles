apt:
  keyrings:
    - url:  https://cli.github.com/packages/githubcli-archive-keyring.gpg
      dest: /etc/apt/keyrings/githubcli-archive-keyring.gpg
    # mise の鍵は ASCII 形式なので、apt が読めるように拡張子を .asc にする
    - url:  https://mise.jdx.dev/gpg-key.pub
      dest: /etc/apt/keyrings/mise-archive-keyring.asc

  repositories:
    - repo:     deb [arch=amd64 signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main
      filename: github-cli
    - repo:     deb [arch=amd64 signed-by=/etc/apt/keyrings/mise-archive-keyring.asc] https://mise.jdx.dev/deb stable main
      filename: mise

  packages:
    - direnv
    - gh
    - git
    - jq
    - mise
    - neovim
    - python3-apt
    - tmux
    - tree
    - unzip
    - xsel

# Python・Node などのバージョンは config/mise/config.toml に書く
mise:
  link:
    config/mise: .config/mise

pip:
  packages:
    - pynvim

claude:
  link:
    claude/CLAUDE.md:        .claude/CLAUDE.md
    claude/commands:         .claude/commands
    claude/keybindings.json: .claude/keybindings.json
    claude/settings.json:    .claude/settings.json
    claude/skills:           .claude/skills

  # dotfiles では管理しないが、WSL 側の実体を Windows 側からも参照させるディレクトリ (ホームからの相対パス)
  windows_share:
    - .claude/backlog-data

bash:
  link:
    config/bash: .config/bash

  # ~/.bashrc から読み込むファイル (ホームからの相対パス)
  source:
    - .config/bash/prompt.bash
    - .config/bash/mise.bash

vscode:
  settings: vscode/settings.json

  # Windows 側のホームにリンクするファイル・ディレクトリ (dotfiles からの相対パス: ホームからの相対パス)
  # settings.json から ~ 始まりのパスで参照するものを、WSL・Windows のどちらでも同じパスで読めるようにする
  windows_link:
    config/cspell: .config/cspell

  extensions:
    - anthropic.claude-code
    - eamodio.gitlens
    - mhutchie.git-graph
    - ms-ceintl.vscode-language-pack-ja
    - ms-python.isort
    - ms-python.python
    - ms-vscode-remote.remote-wsl
    - ms-vscode.cpp-devtools
    - ms-vscode.cpptools-extension-pack
    - oderwat.indent-rainbow
    - pkief.material-icon-theme
    - seatonjiang.gitmoji-vscode
    - streetsidesoftware.code-spell-checker
    - vscodevim.vim
    - vue.volar
    - yzhang.markdown-all-in-one

  # 自作の拡張機能を置くディレクトリ (dotfiles からの相対パス)。直下の package.json があるフォルダを .vsix にして入れる
  local_extensions_dir: vscode/extensions
  # .vsix の作成に npx で使う @vscode/vsce のバージョン
  vsce_version: '4.0.0'

link:
  config/cspell:        .config/cspell
  config/nvim:          .config/nvim
  # ~/.config/git には ignore などのローカルファイルもあるので、ディレクトリごとではなくファイル単位でリンクする
  config/git/config:    .config/git/config
  config/git/template:  .config/git/template
  config/tmux:          .config/tmux

# リンクせずに環境ごとに中身を書くファイル。なければ空で作る
local_files:
  # ないと git config --global の書き込みが ~/.config/git/config (dotfiles の config/git/config) に入ってしまう
  - .gitconfig
