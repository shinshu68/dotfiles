# yaml-language-server: $schema=https://aka.ms/configuration-dsc-schema/0.2
# 会社・私用のどちらの PC にも入れるもの
properties:
  resources:
    - resource: Microsoft.Windows.Settings/WindowsSettings
      directives:
        description: 開発者モードを有効にする（WSL からシンボリックリンクを作るため）
        allowPrerelease: true
        securityContext: elevated
      settings:
        DeveloperMode: true

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: Git for Windows をインストールする
      settings:
        id: Git.Git
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: GitHub CLI をインストールする
      settings:
        id: GitHub.cli
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: VS Code をインストールする
      settings:
        id: Microsoft.VisualStudioCode
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: Google Chrome をインストールする
      settings:
        id: Google.Chrome
        source: winget
  configurationVersion: 0.2.0
