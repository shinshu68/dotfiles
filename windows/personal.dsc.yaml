# yaml-language-server: $schema=https://aka.ms/configuration-dsc-schema/0.2
# 私用の PC にだけ入れるもの (base.dsc.yaml の後に適用する)
properties:
  resources:
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: Discord をインストールする
      settings:
        id: Discord.Discord
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: 1Password をインストールする
      settings:
        id: AgileBits.1Password
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: Claude のデスクトップアプリをインストールする
      settings:
        id: Anthropic.Claude
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: ChatGPT のデスクトップアプリ (Codex を含む) をインストールする
      settings:
        id: OpenAI.ChatGPT
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: Codex CLI をインストールする (Claude Code からコードレビューを頼むため)
      settings:
        id: OpenAI.Codex
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: Vivaldi をインストールする
      settings:
        id: Vivaldi.Vivaldi
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      directives:
        description: Go をインストールする
      settings:
        id: GoLang.Go
        source: winget
  configurationVersion: 0.2.0
